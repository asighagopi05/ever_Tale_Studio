<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Illustration of Polaroid-style and normal photo prints">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2236"/><stop offset="1" stop-color="#16111e"/></linearGradient>
<linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3b6d4"/><stop offset=".6" stop-color="#b9a4f4"/><stop offset="1" stop-color="#7fb7e8"/></linearGradient>
<linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8e8f2"/><stop offset="1" stop-color="#f6d8c9"/></linearGradient>
<linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset=".55" stop-color="#e7a8d0"/><stop offset="1" stop-color="#6b5aa8"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect width="800" height="1000" fill="url(#bg)"/>
<g fill="#fff" opacity=".8"><circle cx="90" cy="110" r="2"/><circle cx="700" cy="90" r="2.5"/><circle cx="740" cy="300" r="1.8"/><circle cx="60" cy="520" r="2"/><circle cx="720" cy="880" r="2"/><circle cx="120" cy="930" r="1.8"/></g>
<path d="M60 160 Q400 70 740 170" fill="none" stroke="#b9a4f4" stroke-opacity=".5" stroke-width="2"/>
<!-- polaroid 1 -->
<g transform="translate(70 200) rotate(-8 170 210)" filter="url(#sh)">
<rect width="340" height="410" rx="6" fill="#f7f3ee"/><rect x="22" y="22" width="296" height="296" fill="url(#s1)"/>
<circle cx="230" cy="110" r="38" fill="#fff" opacity=".85"/><path d="M22 318 L120 210 L190 270 L250 190 L318 318Z" fill="#4b3b78" opacity=".75"/>
<path d="M60 372 q20 -22 40 0 t40 0 t40 0" fill="none" stroke="#b9a4f4" stroke-width="3"/></g>
<!-- polaroid 2 -->
<g transform="translate(420 150) rotate(7 170 210)" filter="url(#sh)">
<rect width="340" height="410" rx="6" fill="#f7f3ee"/><rect x="22" y="22" width="296" height="296" fill="url(#s2)"/>
<path d="M22 318 Q120 230 200 280 T318 250 V318Z" fill="#7a9f87" opacity=".85"/><circle cx="90" cy="100" r="30" fill="#fff" opacity=".9"/>
<path d="M120 365 h100" stroke="#b9a4f4" stroke-width="3" stroke-linecap="round"/></g>
<!-- normal print -->
<g transform="translate(150 560) rotate(3 250 210)" filter="url(#sh)">
<rect width="500" height="340" rx="3" fill="#fbf9f6"/><rect x="14" y="14" width="472" height="312" fill="url(#s3)"/>
<circle cx="360" cy="120" r="46" fill="#fff3d6" opacity=".9"/><path d="M14 326 L150 170 L250 260 L340 190 L486 326Z" fill="#3d2f68" opacity=".8"/></g>
<!-- tape -->
<rect x="215" y="188" width="90" height="30" fill="#e7a8d0" opacity=".75" transform="rotate(-8 260 203)"/>
<rect x="520" y="140" width="90" height="30" fill="#a8e8f2" opacity=".7" transform="rotate(7 565 155)"/>
<rect x="340" y="552" width="90" height="30" fill="#b9a4f4" opacity=".75" transform="rotate(3 385 567)"/>
<text x="400" y="960" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="34" fill="#F2EFF8">Polaroid-style &amp; normal prints</text>
</svg>
